  <style>
    :root {
      --midnight: #100A24;
      --pink: #FF5CBD;
      --purple: #A32CDB;
      --text: #F8F2FF;
      --muted: #C7B3DB;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { min-height: 100%; background: var(--midnight); }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      background:
        radial-gradient(ellipse 410px 340px at 84% 12%, #75259b44, transparent 78%),
        radial-gradient(ellipse 450px 400px at 9% 91%, #c52b9b28, transparent 78%),
        var(--midnight);
      color: var(--text);
      font-family: Inter, "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main { width: 100%; display: flex; justify-content: center; padding: 30px 18px; }
    .panel {
      width: min(100%, 422px);
      padding: clamp(34px, 8vw, 52px) clamp(24px, 7vw, 44px);
      border: 1px solid #a75ac265;
      border-radius: 27px;
      text-align: center;
      background: linear-gradient(145deg, #352049e8, #1b1035f0 73%);
      box-shadow: 0 30px 95px #00000065, 0 0 65px #912dba12;
    }
    .logo {
      display: block;
      width: 112px;
      height: 112px;
      margin: 0 auto 17px;
      object-fit: cover;
      border-radius: 27px;
      box-shadow: 0 14px 38px #11081988;
    }
    h1 {
      margin: 0;
      font-size: clamp(43px, 11vw, 54px);
      letter-spacing: -2.9px;
      font-weight: 850;
      line-height: 1.1;
    }
    .dot { color: var(--pink); }
    .tagline {
      margin: 13px 0 33px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .35px;
      line-height: 1.6;
    }
    .telegram-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      min-height: 54px;
      width: 100%;
      padding: 15px 18px;
      border: 0;
      border-radius: 15px;
